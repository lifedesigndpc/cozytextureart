<script src="/vendor/react-18.3.1.min.js"></script>

<script>
'use strict';
const ARTIST = 'Cozy Texture Art';
const INK = '#2B2622', PAPER = '#F7F4EF';
const PIECES = window.ARTWORKS || [];
const TAGS = window.TAGS || {};
const FAMILIES = window.FAMILIES || {};
const SUITS = window.SUITS || [];

const SHAPE_LABEL = {portrait:'Portrait',square:'Square',round:'Round',arch:'Arch',landscape:'Landscape'};
const SHAPE_RADIUS = {portrait:'2px',square:'2px',round:'50%',arch:'50% 50% 2px 2px / 37% 37% 2px 2px',landscape:'2px'};
const SHAPE_ICON = {portrait:['11px','14px','1px'],square:['13px','13px','1px'],round:['14px','14px','50%'],arch:['11px','15px','6px 6px 1px 1px'],landscape:['16px','11px','1px']};
const STATUS_LABEL = {sold:'Sold · commissions welcome', reserved:'Reserved'};

const bySlug = s => PIECES.find(p => p.slug === s);
const dims = p => p.size ? (p.size.d ? `${p.size.d} cm diameter` : `${p.size.w} × ${p.size.h} cm`) : '';
const tagLabel = t => TAGS[t] || t;
const piecesIn = room => PIECES.filter(p => (p.tags||[]).some(t => room.tags.includes(t)));
const ROOMS = (window.ART_ROOMS || []).map(r => ({...r, pieces: piecesIn(r)})).filter(r => r.pieces.length);
const roomBySlug = s => ROOMS.find(r => r.slug === s);
const aspect = img => img ? img.w / img.h : 4/5;

// ───────── Routing: /, /collection, /collection/<room>, /art/<slug>, /about ─────────
function parseRoute() {
  const u = new URL(location.href);
  const parts = u.pathname.split('/').filter(Boolean);
  if (!parts.length) return {screen:'home'};
  if (parts[0] === 'collection') return {screen:'collection', room:parts[1] || null, fTag:u.searchParams.get('tag'), q:u.searchParams.get('q') || ''};
  if (parts[0] === 'art' && parts[1] && bySlug(parts[1])) return {screen:'detail', slug:parts[1]};
  if (parts[0] === 'about') return {screen:'about'};
  return {screen:'notfound'};
}

// ───────── Decorative procedural textures (texture-vs-print slider, process steps, empty hero) ─────────
// Not catalogue pieces: they illustrate relief where no photo can.
const C = {cream:'#F6EFE3',butter:'#F3E3B0',peach:'#F5D6C6',rose:'#E6B8BF',lavender:'#D8CDE9',lilac:'#C8BEDF',powder:'#C6D8E8',mist:'#DDE7EC',sage:'#C9D8C1',pistachio:'#D9E4BF',mint:'#CFE6DA',sand:'#E8DCCB',oat:'#EDE3D2',clay:'#E4C7B1',terracotta:'#DDB29A',bubblegum:'#F4B9CF',aqua:'#AFE1DB',lemon:'#F5E69B'};
const DIM = {rect:[400,500],square:[440,440],round:[440,440],arch:[400,540],land:[520,390]};
const RAD = {rect:'2px',square:'2px',round:'50%',arch:'50% 50% 2px 2px / 37% 37% 2px 2px',land:'2px'};
const DECOR = {
  plaster:{kind:'sun',shape:'rect',cols:['oat','sand','clay','terracotta'],relief:5,freq:'0.006 0.028',seed:3},
  bands:{kind:'bands',shape:'rect',cols:['mint','sage','pistachio','cream'],relief:4.5,freq:'0.004 0.035',seed:11},
  arch:{kind:'arch',shape:'arch',cols:['lilac','bubblegum','lemon','aqua'],relief:4,freq:'0.012',seed:5},
  bloom:{kind:'bloom',shape:'round',cols:['peach','rose','butter','cream'],relief:6,freq:'0.02',seed:21},
  tide:{kind:'tide',shape:'land',cols:['mist','powder','lavender','cream'],relief:6.5,freq:'0.003 0.03',seed:8},
  field:{kind:'bands',shape:'square',cols:['butter','pistachio','sage','cream'],relief:5,freq:'0.005 0.04',seed:14}
};

// React.createElement, plus inline CSS strings parsed into style objects so the markup can stay close to HTML.
const h = React.createElement;
const styleCache = new Map();
function parseStyle(s) {
  let o = styleCache.get(s); if (o) return o;
  o = {};
  for (const d of s.split(';')) {
    const i = d.indexOf(':'); if (i < 0) continue;
    let k = d.slice(0, i).trim(); const v = d.slice(i + 1).trim(); if (!k) continue;
    if (!k.startsWith('--')) k = k.replace(/^-webkit-/, 'Webkit-').replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    o[k] = v;
  }
  if (styleCache.size > 3000) styleCache.clear();
  styleCache.set(s, o); return o;
}
function hx(type, props, ...kids) {
  if (props && typeof props.style === 'string') props = {...props, style: parseStyle(props.style)};
  return h(type, props, ...kids);
}
const html = htm.bind(hx);

function shapes(a, w, H) {
  const c = a.cols.map(n => C[n]);
  const R = (x,y,ww,hh,f,k) => h('rect',{key:k,x,y,width:ww,height:hh,fill:f});
  const O = (cx,cy,r,f,k) => h('circle',{key:k,cx,cy,r,fill:f});
  const bg = R(-60,-60,w+120,H+120,c[0],'bg');
  switch (a.kind) {
    case 'sun': return [bg, O(w*.5,H*.38,w*.27,c[1],1), R(-60,H*.64,w+120,H,c[2],2), R(-60,H*.8,w+120,H*.07,c[3],3)];
    case 'bands': return [bg, R(-60,H*.28,w+120,H*.3,c[1],1), R(-60,H*.54,w+120,H*.24,c[2],2), R(-60,H*.76,w+120,H*.4,c[3],3), O(w*.72,H*.16,w*.06,c[2],4)];
    case 'arch': return [bg, R(w*.25,H*.38,w*.5,H*.7,c[1],1), O(w*.5,H*.38,w*.25,c[1],2), O(w*.5,H*.32,w*.08,c[2],3), R(-60,H*.86,w+120,H,c[3],4)];
    case 'bloom': {
      const out=[bg]; for (let i=0;i<6;i++){const t=i*Math.PI/3; out.push(O(w*.5+Math.cos(t)*w*.18,H*.5+Math.sin(t)*w*.18,w*.14,c[1],'p'+i));}
      out.push(O(w*.5,H*.5,w*.1,c[2],'c'), O(w*.82,H*.16,w*.06,c[3],'d')); return out; }
    case 'tide': return [bg, O(w*.18,H*1.02,w*.58,c[1],1), O(w*.88,H*1.12,w*.62,c[2],2), O(w*.45,H*1.34,w*.55,c[3],3)];
  }
  return [bg];
}

// Warped flat shapes lit by a turbulence height map, so relief responds to light direction.
function artSvg(a, o) {
  const [w,H] = DIM[a.shape]; const id = 'tx-' + o.uid;
  const el = o.el ?? 35, az = o.az ?? 225; const s = Math.max(.12, Math.sin(el*Math.PI/180));
  const rel = o.relief ?? a.relief;
  const fx = [
    h('feTurbulence',{key:'w',type:'fractalNoise',baseFrequency:'0.014',numOctaves:2,seed:a.seed,result:'warp'}),
    h('feDisplacementMap',{key:'d',in:'SourceGraphic',in2:'warp',scale:30,xChannelSelector:'R',yChannelSelector:'G',result:'paint'})
  ];
  if (!o.flat) fx.push(
    h('feTurbulence',{key:'t',type:'fractalNoise',baseFrequency:a.freq,numOctaves:4,seed:a.seed+7,result:'height'}),
    h('feDiffuseLighting',{key:'l',in:'height',surfaceScale:rel,diffuseConstant:1,lightingColor:'#ffffff',result:'light'}, h('feDistantLight',{azimuth:az,elevation:el})),
    h('feComposite',{key:'c',in:'paint',in2:'light',operator:'arithmetic',k1:(.7/s).toFixed(3),k2:.3,k3:0,k4:0})
  );
  return h('svg',{viewBox:`0 0 ${w} ${H}`,preserveAspectRatio:'xMidYMid slice',style:{display:'block',width:'100%',height:'100%'},'aria-hidden':true},
    h('defs',null,h('filter',{id,x:0,y:0,width:w,height:H,filterUnits:'userSpaceOnUse',colorInterpolationFilters:'sRGB'},...fx)),
    h('g',{filter:`url(#${id})`},...shapes(a,w,H)));
}
function decorBox(a, o) {
  const [w,H] = DIM[a.shape];
  return h('div',{style:{width:'100%',aspectRatio:`${w} / ${H}`,borderRadius:RAD[a.shape],overflow:'hidden',background:C[a.cols[0]],boxShadow:shadowFor(o.az)}}, artSvg(a,o));
}

// Soft warm shadow that falls away from the light (azimuth in degrees).
function shadowFor(az = 225) {
  const r = az*Math.PI/180;
  return `0 1px 2px rgba(60,40,20,.12), ${(-Math.cos(r)*14).toFixed(1)}px ${(-Math.sin(r)*14+10).toFixed(1)}px 36px -10px rgba(70,48,28,.32)`;
}

// A piece's front photo, hung on the paper. Photos with `tight: false` include background, so they get no shape mask or shadow.
function photo(p, o = {}) {
  const img = p.images.front; const tight = img.tight !== false;
  const src = o.small && img.src.endsWith('/front.webp') ? img.src.replace('/front.webp','/front-sm.webp') : img.src;
  return h('div',{style:{width:'100%',aspectRatio:`${img.w} / ${img.h}`,borderRadius:tight?SHAPE_RADIUS[p.shape]:'2px',overflow:'hidden',background:'#EFEAE2',boxShadow:tight&&o.shadow!==false?shadowFor(o.az):'none'}},
    h('img',{src,alt:img.alt||`${p.title}, texture art by ${ARTIST}`,loading:o.eager?'eager':'lazy',decoding:'async',draggable:false,style:{display:'block',width:'100%',height:'100%',objectFit:'cover'}}));
}

const eyebrow = (t, extra='') => html`<div style="border-top:1.5px solid ${INK};padding-top:12px;font-size:11px;letter-spacing:.42em;text-transform:uppercase;${extra}">${t}</div>`;
const roundBtn = (onClick, label, size=48) => html`<button onClick=${onClick} aria-label=${label==='←'?'Previous':'Next'} style="flex:none;width:${size}px;height:${size}px;border-radius:50%;border:1px solid ${INK};background:transparent;cursor:pointer;font-size:16px;color:${INK}">${label}</button>`;
const chipBtn = (c, inner) => html`<button onClick=${c.onClick} style="display:flex;align-items:center;gap:10px;padding:${c.pad||'8px 16px'};border-radius:999px;border:1px solid ${c.bd};background:${c.bg};color:${INK};cursor:pointer;font-size:13px;letter-spacing:.06em">${inner||c.label}</button>`;
const SECT = 'padding-left:clamp(16px,4vw,56px);padding-right:clamp(16px,4vw,56px);box-sizing:border-box';
const TEXT_LINK = `cursor:pointer;font-size:12px;letter-spacing:.36em;text-transform:uppercase;color:${INK};border-bottom:1px solid ${INK};padding-bottom:6px`;

class App extends React.Component {
  state = { ...parseRoute(), lx:.5, ly:.45, cmp:50, fFam:null, fShape:null, fRoom:null, sIdx:0,
    view:'front', zx:50, zy:50, saved:{}, interest:'Buy this piece', fName:'', fEmail:'', fMsg:'', sent:false,
    vw:window.innerWidth, vh:window.innerHeight };

  componentDidMount() {
    this.tx=.5; this.ty=.45; this.last=0; this.frame=0;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const tick = now => {
      this.frame++;
      const st=this.state;
      if (st.screen==='home' && !reduce) {
        let tx=this.tx, ty=this.ty;
        // Idle: the light drifts in a slow orbit so shadows keep moving.
        if (now-this.last>2500) { const t=now/2600; tx=.5+.42*Math.cos(t); ty=.45+.38*Math.sin(t); }
        const lx=st.lx+(tx-st.lx)*.12, ly=st.ly+(ty-st.ly)*.12;
        if (this.frame%2===0 && (Math.abs(lx-st.lx)>.002||Math.abs(ly-st.ly)>.002)) this.setState({lx,ly});
      }
      this.raf=requestAnimationFrame(tick);
    };
    this.raf=requestAnimationFrame(tick);
    this.onResize=()=>this.setState({vw:window.innerWidth,vh:window.innerHeight});
    this.onPop=()=>this.applyRoute();
    window.addEventListener('resize',this.onResize);
    window.addEventListener('popstate',this.onPop);
    this.syncHead();
  }
  componentWillUnmount(){ cancelAnimationFrame(this.raf); window.removeEventListener('resize',this.onResize); window.removeEventListener('popstate',this.onPop); }
  componentDidUpdate(_, prev){ if (prev.screen!==this.state.screen || prev.slug!==this.state.slug || prev.room!==this.state.room) this.syncHead(); }

  syncHead() {
    const st=this.state; const p=st.screen==='detail'&&bySlug(st.slug); const r=st.screen==='collection'&&roomBySlug(st.room);
    document.title = p ? `${p.title} · ${ARTIST}` : r ? `${r.name} · ${ARTIST}` : st.screen==='collection' ? `Collection · ${ARTIST}` : st.screen==='about' ? `About · ${ARTIST}` : ARTIST;
    const m=document.querySelector('meta[name=description]'); if (m && p) m.content = p.concept || p.holds || m.content;
  }

  applyRoute() {
    this.setState({ slug:null, room:null, q:'', fTag:null, fFam:null, fShape:null, fRoom:null, ...parseRoute(), sIdx:0, view:'front', sent:false, fMsg:'' });
  }
  go(to) { if (to !== location.pathname + location.search) history.pushState(null, '', to); this.applyRoute(); window.scrollTo(0,0); }
  // Real links (so pieces can be opened in a new tab and shared), routed in-page on a plain click.
  link(to, kids, style='', cls='') {
    return html`<a href=${to} className=${'plain '+cls} style=${style} onClick=${e=>{ if (e.metaKey||e.ctrlKey||e.shiftKey||e.button) return; e.preventDefault(); this.go(to); }}>${kids}</a>`;
  }

  filtered() {
    const {q,fFam,fTag,fShape,fRoom}=this.state; const qq=(q||'').trim().toLowerCase();
    return PIECES.filter(p => (!fFam||p.family===fFam)&&(!fTag||(p.tags||[]).includes(fTag))&&(!fShape||p.shape===fShape)&&(!fRoom||(p.suits||[]).includes(fRoom))&&
      (!qq || [p.title,p.concept,p.holds,SHAPE_LABEL[p.shape],...(p.tags||[]).map(tagLabel),...(p.suits||[]),...(p.palette||[]).map(c=>c.name)].join(' ').toLowerCase().includes(qq)));
  }
  chip(active,onClick,label,extra={},activeBg='#E9E1D5') { return {label,onClick,bg:active?activeBg:'transparent',bd:active?INK:'rgba(43,38,34,.25)',...extra}; }

  // ───────── Nav / footer ─────────
  nav(m) {
    const item=(label,to,fn)=>fn
      ? html`<span onClick=${fn} className="hov-rose" style="cursor:pointer;color:${INK}">${label}</span>`
      : this.link(to,label,`color:${INK}`,'hov-rose');
    return html`<nav style="position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(16px,4vw,56px);background:rgba(247,244,239,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(43,38,34,.08)">
      ${this.link('/',html`<span style="display:flex;align-items:baseline;gap:10px">
        <span style="font-family:'Instrument Serif',serif;font-size:${m?24:28}px;font-style:italic;line-height:1">Cozy</span>
        <span style="font-size:10px;letter-spacing:${m?'.22em':'.32em'};text-transform:uppercase;color:#7A7067">Texture Art</span>
      </span>`)}
      <div style="display:flex;gap:${m?'14px':'clamp(18px,3vw,40px)'};font-size:${m?10:12}px;letter-spacing:${m?'.16em':'.3em'};text-transform:uppercase">
        ${item('Collection','/collection')}
        ${item('About','/about')}
        ${item('Search',null,()=>{ this.go('/collection'); setTimeout(()=>this.searchEl&&this.searchEl.focus(),60); })}
      </div>
    </nav>`;
  }
  footer() {
    return html`<footer style="padding:48px clamp(16px,4vw,56px);border-top:1px solid rgba(43,38,34,.12);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:20px">
      <span style="font-family:'Instrument Serif',serif;font-style:italic;font-size:26px">${ARTIST}</span>
      <div style="display:flex;flex-wrap:wrap;gap:28px;font-size:11px;letter-spacing:.3em;text-transform:uppercase">
        <a href="#">Instagram</a>
      </div>
      <span style="font-size:12px;color:#7A7067">Hand-built, layer by layer · © 2026</span>
    </footer>`;
  }

  // ───────── Home ─────────
  home(m) {
    const st=this.state; const W=st.vw, H=Math.max(760,st.vh-66);
    const slots = m
      ? [[5,50,30,-2,.2,.56,.7],[64,49,28,3,.78,.55,1],[38,57,24,2,.5,.64,.8],[6,77,30,-3,.2,.84,1.1],[55,81,38,1,.74,.88,.5]]
      : [[4,9,17,-2,.12,.36,.7],[10,59,13,3,.165,.75,1],[79,7,14,2,.86,.33,.8],[72,58,14.5,-3,.79,.77,1.1],[39,73,20,1,.5,.88,.5]];
    const featured = PIECES.filter(p=>p.featured).concat(PIECES.filter(p=>!p.featured));
    const real = featured.length >= 3;
    const decor = ['plaster','bloom','arch','field','tide'];
    const heroArts = slots.map(([l,t,w,rot,cx,cy,d],i)=>{
      const p = real ? featured[i] : null; if (real && !p) return null;
      const dx=(st.lx-cx)*W, dy=(st.ly-cy)*H; const dist=Math.hypot(dx,dy);
      const az=Math.atan2(dy,dx)*180/Math.PI; const el=Math.max(14,Math.min(48,52-dist/18));
      const px=(st.lx-.5)*-28*d, py=(st.ly-.45)*-20*d;
      // Keep pieces of different aspect at a similar visual area.
      const width = p ? Math.min(w*1.35, w*Math.sqrt(aspect(p.images.front)/.8)) : w;
      const pos=`position:absolute;left:${l}%;top:${t}%;width:${width.toFixed(1)}vw;transform:translate(${px.toFixed(1)}px,${py.toFixed(1)}px) rotate(${rot}deg);will-change:transform`;
      if (!p) return html`<div key=${'d'+i} style=${pos}>${decorBox(DECOR[decor[i]],{uid:'h-'+i,az,el})}</div>`;
      return html`<div key=${p.slug} style=${pos}>${this.link('/art/'+p.slug,html`
        ${photo(p,{az,eager:true,small:true})}
        <div style="margin-top:${m?8:14}px;font-size:${m?8:10}px;letter-spacing:.3em;text-transform:uppercase;color:#7A7067;text-align:center">${p.title}</div>`)}</div>`;
    });

            <div style="position:absolute;top:18px;left:18px;background:rgba(247,244,239,.92);padding:8px 12px;font-size:10px;letter-spacing:.3em;text-transform:uppercase">${VLABEL[st.view]}</div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:stretch">
            ${views.map(x=>html`<div key=${x.k} onClick=${()=>this.setState({view:x.k,zx:50,zy:50})} style="width:${m?72:84}px;display:flex;flex-direction:column;gap:6px;cursor:pointer">
              <div style="position:relative;width:${m?72:84}px;height:${m?72:84}px;overflow:hidden;outline:${st.view===x.k?`1.5px solid ${INK}`:'1px solid rgba(43,38,34,.12)'};outline-offset:2px">${stage(x.k,true)}</div>
              <span style="font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#5A5149;text-align:center">${x.l}</span>
            </div>`)}
          </div>
        </div>

        <div style="flex:1 1 ${m?'100%':'380px'};min-width:0;display:flex;flex-direction:column;gap:26px">
          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:#7A7067">Texture art · ${p.year}</div>
            <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(44px,4.6vw,68px);line-height:1">${p.title}</h1>
            <div style="font-family:'Instrument Serif',serif;font-style:italic;font-size:20px;color:#5A5149">by ${ARTIST}</div>
          </div>
          ${STATUS_LABEL[p.status] && html`<div style="font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#8E5A55">${STATUS_LABEL[p.status]}</div>`}
          ${p.concept && html`<p style="margin:0;font-size:16px;line-height:1.7;color:#4A433C;max-width:560px;text-wrap:pretty">${p.concept}</p>`}
          <div style="display:flex;flex-direction:column;border-top:1px dotted rgba(43,38,34,.35)">
            ${specs.map(s=>html`<div key=${s.k} style="display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px dotted rgba(43,38,34,.35);font-size:14px">
              <span style="font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#7A7067;padding-top:2px">${s.k}</span>
              <span style="text-align:right">${s.v}</span>
            </div>`)}
          </div>
          ${p.holds && html`<div style="display:flex;flex-direction:column;gap:12px">
            <div style="font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:#7A7067">What it holds</div>
            <p style="margin:0;font-family:'Instrument Serif',serif;font-size:24px;line-height:1.3;text-wrap:pretty">${p.holds}</p>
          </div>`}
          ${(p.palette||[]).length>0 && html`<div style="display:flex">
            ${p.palette.map(c=>html`<div key=${c.name} style="flex:1;display:flex;flex-direction:column;gap:6px">
              <div style="height:44px;background:${c.hex}"></div>
              <span style="font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#5A5149">${c.name}</span>
            </div>`)}
          </div>`}
          ${(p.tags||[]).length>0 && html`<div style="display:flex;flex-wrap:wrap;gap:8px">
            ${p.tags.map(t=>html`<span key=${t}>${this.link('/collection?tag='+encodeURIComponent(t),tagLabel(t),`display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid rgba(43,38,34,.25);font-size:12px;letter-spacing:.06em;color:${INK}`,'hov-ul')}</span>`)}
          </div>`}
          <div style="display:flex;flex-direction:column;gap:12px">
            <button onClick=${toEnquire} className="hov-dark" style="padding:20px;border:none;background:${INK};color:${PAPER};cursor:pointer;font-size:12px;letter-spacing:.32em;text-transform:uppercase">${p.status==='sold'?'Enquire about a commission':'Enquire about this piece'}</button>
            <button onClick=${()=>this.setState(s=>({saved:{...s.saved,[p.slug]:!s.saved[p.slug]}}))} style="padding:18px;border:1px solid ${INK};background:transparent;color:${INK};cursor:pointer;font-size:12px;letter-spacing:.32em;text-transform:uppercase">${st.saved[p.slug]?'Saved ✓':'Save for later'}</button>
            <p style="margin:6px 0 0;font-size:13px;line-height:1.6;color:#7A7067">One of one. Crated and shipped in 5–7 days; international on request. A piece like this can also be made in your size.</p>
          </div>
        </div>
      </div>
    </section>

    <section data-screen-label="03b Enquire" ref=${el=>{this.enqEl=el;}} style="${SECT};background:#F0EBE3;padding-top:90px;padding-bottom:90px;display:flex;flex-wrap:wrap;gap:56px;justify-content:center">
      <div style="flex:1 1 300px;max-width:460px;display:flex;flex-direction:column;gap:20px">
        ${eyebrow('Enquire','align-self:flex-start')}
        <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(38px,4vw,56px);line-height:1.02">Ask anything about <span style="font-style:italic">${p.title}.</span></h2>
        <p style="margin:0;font-size:16px;line-height:1.7;color:#5A5149">Every message gets a personal reply, usually within a day. Send a photo of your wall if you like, and you'll get an honest answer on whether this piece suits it.</p>
        <div style="width:140px;margin-top:10px">${photo(p,{az:230,small:true})}</div>
      </div>
      <div style="flex:1 1 300px;max-width:600px">
        ${!st.sent ? html`<div style="display:flex;flex-direction:column;gap:22px">
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            ${interests.map(l=>html`<span key=${l}>${chipBtn(this.chip(interest===l,()=>this.setState({interest:l}),l,{pad:'10px 16px'},'#E2D8CA'))}</span>`)}
          </div>
          ${field('Your name',html`<input value=${st.fName} onChange=${e=>this.setState({fName:e.target.value})} autoComplete="name" style=${FIELD} />`)}
          ${field('Email',html`<input type="email" value=${st.fEmail} onChange=${e=>this.setState({fEmail:e.target.value})} autoComplete="email" style=${FIELD} />`)}
          ${field('Message',html`<textarea value=${fMsg} onChange=${e=>this.setState({fMsg:e.target.value})} rows="4" style=${FIELD+';line-height:1.5;resize:vertical'}></textarea>`)}
          <button onClick=${()=>this.setState({sent:true})} className="hov-dark" style="align-self:flex-start;padding:18px 34px;border:none;background:${INK};color:${PAPER};cursor:pointer;font-size:12px;letter-spacing:.32em;text-transform:uppercase">Send message</button>
        </div>` : html`<div style="display:flex;flex-direction:column;gap:16px;padding-top:40px">
          <div style="font-family:'Instrument Serif',serif;font-size:44px;line-height:1.05">Thank you, ${st.fName.split(' ')[0]||'friend'}.</div>
          <p style="margin:0;font-size:16px;line-height:1.7;color:#5A5149">Your note about ${p.title} is in. A reply will reach ${st.fEmail||'you'} within a day, often with a short video of the piece in morning light.</p>
        </div>`}
      </div>
    </section>

    ${PIECES.length>1 && html`<section style="${SECT};padding-top:56px;padding-bottom:56px;display:flex;justify-content:space-between;gap:20px;font-size:12px;letter-spacing:.3em;text-transform:uppercase">
      ${this.link('/art/'+pa.slug,'← '+pa.title)}
      ${this.link('/art/'+na.slug,na.title+' →','text-align:right')}
    </section>`}`;
  }

  // ───────── About ─────────
  about() {
    const S=[['plaster','01','Prime','The canvas gets a coat of gesso first, so the texture paste grips and doesn’t crack as it dries.'],
      ['bands','02','Build','Texture paste goes on with a palette knife in thick coats. Each one dries fully, often overnight, before the next.'],
      ['bloom','03','Sculpt','While the top layer is still wet it gets dragged, pressed and scratched with the knife edge. This is where the peaks and ridges come from.'],
      ['tide','04','Paint & seal','Once the relief is set it’s painted in soft acrylics, then varnished so it can be touched and dusted for years.']];
    return html`
    <section data-screen-label="04 About" style="${SECT};padding-top:80px;padding-bottom:80px;display:flex;flex-wrap:wrap;gap:64px;align-items:center;justify-content:center">
      <div style="flex:1 1 320px;max-width:600px;display:flex;flex-direction:column;gap:24px">
        ${eyebrow('About the artist','align-self:flex-start')}
        <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(56px,7vw,104px);line-height:.95">Slow art for <span style="font-style:italic">cozy walls.</span></h1>
        <p style="margin:0;font-size:17px;line-height:1.75;color:#4A433C;text-wrap:pretty">Cozy Texture Art began with a simple wish: walls that feel as warm as a favourite sweater. Each piece is sculpted by hand from texture paste, built up in layers, then painted, so the surface catches the light differently every hour of the day.</p>
        <p style="margin:0;font-size:17px;line-height:1.75;color:#4A433C;text-wrap:pretty">The colours stay soft on purpose. Pastels keep your eye on the surface: a strong red would shout over the texture, while a pale apricot lets you see every knife mark and ridge.</p>
      </div>
      <div style="flex:0 1 440px;aspect-ratio:4 / 5;background:repeating-linear-gradient(135deg,#E6DED2 0 10px,#EDE6DC 10px 20px);display:flex;align-items:flex-end;padding:16px;box-sizing:border-box">
        <span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#7A7067">portrait · artist with palette knife</span>
      </div>
    </section>

    <section data-screen-label="04b Process" style="${SECT};padding-top:60px;padding-bottom:100px;display:flex;flex-direction:column;align-items:center;gap:56px">
      ${eyebrow('How a piece is made')}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:40px;width:100%;max-width:1240px">
        ${S.map(([k,n,title,text])=>{ const a=DECOR[k]; return html`<div key=${n} style="display:flex;flex-direction:column;gap:16px">
          <div style="position:relative;aspect-ratio:1 / 1;overflow:hidden">${h('div',{style:{position:'absolute',inset:0,transform:'scale(2.4)',transformOrigin:'50% 50%'}},artSvg(a,{uid:'pr-'+k,az:210,el:20,relief:a.relief*1.3}))}</div>
          <div style="font-size:11px;letter-spacing:.32em;color:#7A7067">${n}</div>
          <div style="font-family:'Instrument Serif',serif;font-size:30px;line-height:1">${title}</div>
          <p style="margin:0;font-size:15px;line-height:1.65;color:#5A5149">${text}</p>
        </div>`; })}
      </div>
    </section>

    <section data-screen-label="04c Creator" style="${SECT};background:#F0EBE3;padding-top:90px;padding-bottom:90px;display:flex;flex-direction:column;align-items:center;gap:36px;text-align:center">
      <div style="font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#7A7067">Meet the creator</div>
      <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,5vw,72px);line-height:1;max-width:820px">A mother and designer, <span style="font-style:italic">exploring her creative side.</span></h2>
      <p style="margin:0;font-size:16px;line-height:1.7;color:#5A5149;max-width:560px">Behind Cozy Texture Art is a mother and designer who found her way back to making things by hand. Between family life and design work, texture art became the slow, quiet corner of her day, and every piece carries a little of that calm into your home.</p>
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:16px 40px;font-size:12px;letter-spacing:.3em;text-transform:uppercase">
        <a href="#" style="border-bottom:1px solid currentColor;padding-bottom:4px">Instagram</a>
        <a href="#" style="border-bottom:1px solid currentColor;padding-bottom:4px">Email the studio</a>
      </div>
    </section>`;
  }

  notFound() {
    return html`<section style="${SECT};padding-top:120px;padding-bottom:140px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center">
      ${eyebrow('Not here')}
      <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(44px,5.4vw,80px);line-height:1">This wall is <span style="font-style:italic">empty.</span></h1>
      <p style="margin:0;font-size:16px;line-height:1.7;color:#5A5149;max-width:460px">The piece may have found a home, or the link has changed.</p>
      ${this.link('/collection','See the collection →',TEXT_LINK)}
    </section>`;
  }

  render() {
    const st=this.state; const m=st.vw<720;
    let body;
    if (st.screen==='collection') body=this.collection(m);
    else if (st.screen==='detail') body=this.detail(m);
    else if (st.screen==='about') body=this.about(m);
    else if (st.screen==='notfound') body=this.notFound();
    else body=this.home(m);
    return html`<div style="min-height:100vh;background:${PAPER};position:relative">
      ${h('div',{'aria-hidden':true,style:{position:'fixed',inset:0,pointerEvents:'none',zIndex:60,opacity:.32,mixBlendMode:'multiply',backgroundImage:`url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")`}})}
      ${this.nav(m)}
      <main>${body}</main>
      ${this.footer()}
    </div>`;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>

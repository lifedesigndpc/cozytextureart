        <input ref=${el=>{this.searchEl=el;}} value=${st.q} onChange=${e=>this.setState({q:e.target.value,sIdx:0})} placeholder="Search by name, colour, mood or room" aria-label="Search the collection" style="width:min(560px,100%);box-sizing:border-box;border:none;border-bottom:1.5px solid ${INK};background:transparent;padding:14px 4px;font-size:${m?16:18}px;text-align:center;outline:none;color:${INK}" />
      </div>
      <div style="display:flex;flex-direction:column;gap:18px;border-top:1px dotted rgba(43,38,34,.35);border-bottom:1px dotted rgba(43,38,34,.35);padding:24px 0">
        ${row('Palette',famChips)}${row('Theme',themeChips)}${row('Shape',shapeChips)}${row('Room',roomChips)}
      </div>
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px">
        <div style="display:flex;align-items:center;gap:20px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#7A7067">
          <span>${countLabel}</span>
          <span onClick=${()=>this.setState({q:'',fFam:null,fTheme:null,fShape:null,fRoom:null,room:null,sIdx:0})} style="cursor:pointer;color:#8E5A55">Clear filters</span>
        </div>
        ${inRoom && html`<span onClick=${()=>this.setState({room:null,sIdx:0})} style="cursor:pointer;font-size:12px;letter-spacing:.3em;text-transform:uppercase;border-bottom:1px solid ${INK};padding-bottom:4px">← All art rooms</span>`}
      </div>
      ${noResults && html`<p style="margin:40px 0;text-align:center;font-family:'Instrument Serif',serif;font-style:italic;font-size:28px;color:#5A5149">Nothing matches yet. Try a softer search, or write in about a commission.</p>`}
      ${isRooms && html`<div style="display:flex;flex-direction:column;gap:28px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:16px">
          ${eyebrow('Art rooms')}
          <div style="display:flex;gap:12px">
            ${roundBtn(()=>this.rowEl&&this.rowEl.scrollBy({left:-this.rowEl.clientWidth*.8,behavior:'smooth'}),'←')}
            ${roundBtn(()=>this.rowEl&&this.rowEl.scrollBy({left:this.rowEl.clientWidth*.8,behavior:'smooth'}),'→')}
          </div>
        </div>
        <div ref=${el=>{this.rowEl=el;}} className="noscroll" style="display:flex;gap:${m?20:40}px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:10px 0 20px">${artRooms}</div>
      </div>`}
      ${single}
    </section>`;
  }

  // ───────── Detail ─────────
  detail(m) {
    const st=this.state; const a=byId(st.artId); const idx=ARTS.indexOf(a);
    const specs=[{k:'Size',v:a.dims+' · original'},{k:'Relief',v:a.mm+' at the highest ridge'},{k:'Medium',v:'Texture paste and acrylic on gesso-primed, gallery-wrapped canvas, varnished'},{k:'Shape',v:SHAPES[a.shape]},{k:'Suits',v:a.rooms.join(', ')}];
    const is3d=st.view==='3d', isVideo=st.view==='video', isRaking=st.view==='raking';
    const stDown=e=>{ if(st.view!=='3d') return; this.drag={x:e.clientX,y:e.clientY,rx:st.rx,ry:st.ry}; e.currentTarget.setPointerCapture(e.pointerId); };
    const stMove=e=>{ if(!this.drag||this.state.view!=='3d') return; const d=this.drag; this.setState({ry:Math.max(-170,Math.min(170,d.ry+(e.clientX-d.x)*.45)),rx:Math.max(-40,Math.min(40,d.rx-(e.clientY-d.y)*.3))}); };
    const toEnquire=()=>{ if(this.enqEl) window.scrollTo({top:this.enqEl.getBoundingClientRect().top+window.scrollY-70,behavior:'smooth'}); };
    const fMsg=st.fMsg || `Hi, I'd love to know more about ${a.title}.`;
    const pa=ARTS[(idx-1+ARTS.length)%ARTS.length], na=ARTS[(idx+1)%ARTS.length];
    const toggleBtn=(on,onClick,label)=>html`<button onClick=${onClick} style="padding:12px 18px;border:1px solid ${INK};background:${on?INK:'transparent'};color:${on?PAPER:INK};cursor:pointer;font-size:11px;letter-spacing:.26em;text-transform:uppercase">${label}</button>`;
    const field=(label,input)=>html`<label style="display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7A7067">${label}${input}</label>`;
    const FIELD=`border:none;border-bottom:1px solid ${INK};background:transparent;padding:10px 0;font-size:17px;outline:none;color:${INK};letter-spacing:0;text-transform:none`;

    return html`
    <section data-screen-label="03 Artwork detail" style="${SECT};padding-top:36px;padding-bottom:90px;display:flex;flex-direction:column;gap:28px">
      <div style="font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#7A7067;display:flex;flex-wrap:wrap;gap:10px">
        <span onClick=${()=>this.go('home')} style="cursor:pointer">Home</span><span>/</span><span onClick=${()=>this.go('collection')} style="cursor:pointer">Collection</span><span>/</span><span style="color:${INK}">${a.title}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,72px);align-items:flex-start">
        <div style="flex:1 1 ${m?'100%':'520px'};min-width:0;display:flex;flex-direction:column;gap:16px">
          <div onPointerDown=${stDown} onPointerMove=${stMove} onPointerUp=${()=>{ this.drag=null; }} style="position:relative;width:100%;aspect-ratio:1 / 1;overflow:hidden;touch-action:${is3d?'none':'auto'};cursor:${is3d?'grab':'default'};user-select:none">
            ${this.viewEl(a,st.view,'st-'+a.id+'-'+st.view,false)}
            <div style="position:absolute;top:18px;left:18px;background:rgba(247,244,239,.92);padding:8px 12px;font-size:10px;letter-spacing:.3em;text-transform:uppercase">${VLABEL[st.view]}</div>
            ${isRaking && html`<div style="position:absolute;left:18px;right:18px;bottom:18px;background:rgba(247,244,239,.92);padding:12px 16px;display:flex;align-items:center;gap:16px">
              <span style="font-size:10px;letter-spacing:.3em;text-transform:uppercase;white-space:nowrap">Raking angle</span>
              <input type="range" min="0" max="360" value=${st.rakeAz} onChange=${e=>this.setState({rakeAz:+e.target.value})} aria-label="Raking light angle" style="flex:1" />
            </div>`}
            ${is3d && html`<div style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(247,244,239,.92);padding:8px 14px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;white-space:nowrap">Drag to turn · see the 3 cm depth</div>`}
            ${isVideo && html`<div style="position:absolute;left:18px;right:18px;bottom:18px;background:rgba(43,38,34,.82);color:${PAPER};padding:10px 14px;display:flex;align-items:center;gap:14px">
              <button onClick=${()=>this.setState(s=>({playing:!s.playing}))} aria-label=${st.playing?'Pause':'Play'} style="border:none;background:transparent;color:${PAPER};cursor:pointer;font-size:14px;width:24px">${st.playing?'❚❚':'▶'}</button>
              <div style="flex:1;height:2px;background:rgba(247,244,239,.3);position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:${(st.vidT/12*100).toFixed(1)}%;background:${PAPER}"></div></div>
              <span style="font-family:ui-monospace,Menlo,monospace;font-size:11px">0:${String(Math.floor(st.vidT)).padStart(2,'0')} / 0:12</span>
            </div>
            <div style="position:absolute;top:18px;right:18px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#5A5149;background:rgba(247,244,239,.8);padding:4px 8px">${m?'film placeholder':'studio film placeholder · turning the piece'}</div>`}
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:stretch">
            ${VIEWS.map(x=>html`<div key=${x.k} onClick=${()=>this.setState({view:x.k})} style="width:${m?60:84}px;display:flex;flex-direction:column;gap:6px;cursor:pointer">
              <div style="position:relative;width:${m?60:84}px;height:${m?60:84}px;overflow:hidden;outline:${st.view===x.k?`1.5px solid ${INK}`:'1px solid rgba(43,38,34,.12)'};outline-offset:2px">${this.viewEl(a,x.k,'th-'+a.id+'-'+x.k,true)}</div>
              <span style="font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#5A5149;text-align:center">${x.l}</span>
            </div>`)}
            <div style="display:flex;flex-direction:${m?'row':'column'};gap:10px;margin-left:${m?'0':'auto'};justify-content:flex-start">
              ${toggleBtn(is3d,()=>this.setState({view:'3d',rx:-8,ry:-24}),'Turn it in 3D')}
              ${toggleBtn(isVideo,()=>this.setState({view:'video',playing:true}),'Watch the film')}
            </div>
          </div>
        </div>

        <div style="flex:1 1 ${m?'100%':'380px'};min-width:0;display:flex;flex-direction:column;gap:26px">
          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:#7A7067">Texture art · 2026</div>
            <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(44px,4.6vw,68px);line-height:1">${a.title}</h1>
            <div style="font-family:'Instrument Serif',serif;font-style:italic;font-size:20px;color:#5A5149">by ${ARTIST}</div>
          </div>
          <div style="font-size:22px;letter-spacing:.04em">${inr(a.price)}</div>
          <div style="display:flex;flex-direction:column;border-top:1px dotted rgba(43,38,34,.35)">
            ${specs.map(s=>html`<div key=${s.k} style="display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px dotted rgba(43,38,34,.35);font-size:14px">
              <span style="font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#7A7067;padding-top:2px">${s.k}</span>
              <span style="text-align:right">${s.v}</span>
            </div>`)}
          </div>
          <div style="display:flex;flex-direction:column;gap:12px">
            <div style="font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:#7A7067">What it holds</div>
            <p style="margin:0;font-family:'Instrument Serif',serif;font-size:24px;line-height:1.3;text-wrap:pretty">${a.sig}</p>
          </div>
          <div style="display:flex">
            ${a.cols.map(n=>html`<div key=${n} style="flex:1;display:flex;flex-direction:column;gap:6px">
              <div style="height:44px;background:${C[n]}"></div>
              <span style="font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#5A5149">${n}</span>
            </div>`)}
          </div>
          <div style="display:flex;flex-direction:column;gap:12px">
            <button onClick=${toEnquire} className="hov-dark" style="padding:20px;border:none;background:${INK};color:${PAPER};cursor:pointer;font-size:12px;letter-spacing:.32em;text-transform:uppercase">Enquire about this piece</button>
            <button onClick=${()=>this.setState(s=>({saved:{...s.saved,[a.id]:!s.saved[a.id]}}))} style="padding:18px;border:1px solid ${INK};background:transparent;color:${INK};cursor:pointer;font-size:12px;letter-spacing:.32em;text-transform:uppercase">${st.saved[a.id]?'Saved ✓':'Save for later'}</button>
            <p style="margin:6px 0 0;font-size:13px;line-height:1.6;color:#7A7067">One of one. Crated and shipped in 5–7 days; international on request. A piece like this can also be made in your size.</p>
          </div>
        </div>
      </div>
    </section>

    <section data-screen-label="03b Enquire" ref=${el=>{this.enqEl=el;}} style="${SECT};background:#F0EBE3;padding-top:90px;padding-bottom:90px;display:flex;flex-wrap:wrap;gap:56px;justify-content:center">
      <div style="flex:1 1 300px;max-width:460px;display:flex;flex-direction:column;gap:20px">
        ${eyebrow('Enquire','align-self:flex-start')}
        <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(38px,4vw,56px);line-height:1.02">Ask anything about <span style="font-style:italic">${a.title}.</span></h2>
        <p style="margin:0;font-size:16px;line-height:1.7;color:#5A5149">Every message gets a personal reply, usually within a day. Send a photo of your wall if you like, and you'll get an honest answer on whether this piece suits it.</p>
        <div style="width:140px;margin-top:10px">${artBox(a,{uid:'e-'+a.id,az:230,el:30})}</div>
      </div>
      <div style="flex:1 1 300px;max-width:600px">
        ${!st.sent ? html`<div style="display:flex;flex-direction:column;gap:22px">
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            ${['Buy this piece','A similar commission','Visit the studio'].map(l=>{ const c=this.chip(st.interest===l,()=>this.setState({interest:l}),l,{pad:'10px 16px'},'#E2D8CA'); return html`<span key=${l}>${chipBtn(c)}</span>`; })}
          </div>
          ${field('Your name',html`<input value=${st.fName} onChange=${e=>this.setState({fName:e.target.value})} autoComplete="name" style=${FIELD} />`)}
          ${field('Email',html`<input type="email" value=${st.fEmail} onChange=${e=>this.setState({fEmail:e.target.value})} autoComplete="email" style=${FIELD} />`)}
          ${field('Message',html`<textarea value=${fMsg} onChange=${e=>this.setState({fMsg:e.target.value})} rows="4" style=${FIELD+';line-height:1.5;resize:vertical'}></textarea>`)}
          <button onClick=${()=>this.setState({sent:true})} className="hov-dark" style="align-self:flex-start;padding:18px 34px;border:none;background:${INK};color:${PAPER};cursor:pointer;font-size:12px;letter-spacing:.32em;text-transform:uppercase">Send message</button>
        </div>` : html`<div style="display:flex;flex-direction:column;gap:16px;padding-top:40px">
          <div style="font-family:'Instrument Serif',serif;font-size:44px;line-height:1.05">Thank you, ${st.fName.split(' ')[0]||'friend'}.</div>
          <p style="margin:0;font-size:16px;line-height:1.7;color:#5A5149">Your note about ${a.title} is in. A reply will reach ${st.fEmail||'you'} within a day, often with a short video of the piece in morning light.</p>
        </div>`}
      </div>
    </section>

    <section style="${SECT};padding-top:56px;padding-bottom:56px;display:flex;justify-content:space-between;gap:20px;font-size:12px;letter-spacing:.3em;text-transform:uppercase">
      <span onClick=${()=>this.open(pa.id)} style="cursor:pointer">← ${pa.title}</span>
      <span onClick=${()=>this.open(na.id)} style="cursor:pointer;text-align:right">${na.title} →</span>
    </section>`;
  }

  // ───────── About ─────────
  about() {
    const S=[['morning-plaster','01','Prime','The canvas gets a coat of gesso first, so the texture paste grips and doesn’t crack as it dries.'],
      ['sage-hours','02','Build','Texture paste goes on with a palette knife in thick coats. Each one dries fully, often overnight, before the next.'],
      ['petal-study','03','Sculpt','While the top layer is still wet it gets dragged, pressed and scratched with the knife edge. This is where the peaks and ridges come from.'],
      ['low-tide','04','Paint & seal','Once the relief is set it’s painted in soft acrylics, then varnished so it can be touched and dusted for years.']];
    return html`
    <section data-screen-label="04 About" style="${SECT};padding-top:80px;padding-bottom:80px;display:flex;flex-wrap:wrap;gap:64px;align-items:center;justify-content:center">
      <div style="flex:1 1 320px;max-width:600px;display:flex;flex-direction:column;gap:24px">
        ${eyebrow('About the artist','align-self:flex-start')}
        <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(56px,7vw,104px);line-height:.95">Slow art for <span style="font-style:italic">cozy walls.</span></h1>
        <p style="margin:0;font-size:17px;line-height:1.75;color:#4A433C;text-wrap:pretty">Cozy Texture Art began with a simple wish: walls that feel as warm as a favourite sweater. Each piece is sculpted by hand from texture paste, built up in layers, then painted, so the surface catches the light differently every hour of the day.</p>
        <p style="margin:0;font-size:17px;line-height:1.75;color:#4A433C;text-wrap:pretty">The colours stay soft on purpose. Pastels keep your eye on the surface: a strong red would shout over the texture, while a pale apricot lets you see every knife mark and ridge.</p>
      </div>
      <div style="flex:0 1 440px;aspect-ratio:4 / 5;background:repeating-linear-gradient(135deg,#E6DED2 0 10px,#EDE6DC 10px 20px);display:flex;align-items:flex-end;padding:16px;box-sizing:border-box">
        <span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#7A7067">portrait · artist with palette knife</span>
      </div>
    </section>

    <section data-screen-label="04b Process" style="${SECT};padding-top:60px;padding-bottom:100px;display:flex;flex-direction:column;align-items:center;gap:56px">
      ${eyebrow('How a piece is made')}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:40px;width:100%;max-width:1240px">
        ${S.map(([id,n,title,text])=>{ const a=byId(id); return html`<div key=${n} style="display:flex;flex-direction:column;gap:16px">
          <div style="position:relative;aspect-ratio:1 / 1;overflow:hidden">${h('div',{style:{position:'absolute',inset:0,transform:'scale(2.4)',transformOrigin:'50% 50%'}},artSvg(a,{uid:'pr-'+id,az:210,el:20,relief:a.relief*1.3}))}</div>
          <div style="font-size:11px;letter-spacing:.32em;color:#7A7067">${n}</div>
          <div style="font-family:'Instrument Serif',serif;font-size:30px;line-height:1">${title}</div>
          <p style="margin:0;font-size:15px;line-height:1.65;color:#5A5149">${text}</p>
        </div>`; })}
      </div>
    </section>

    <section data-screen-label="04c Contact" style="${SECT};background:#F0EBE3;padding-top:90px;padding-bottom:90px;display:flex;flex-direction:column;align-items:center;gap:36px;text-align:center">
      <div style="font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#7A7067">Meet the creator</div>
      <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,5vw,72px);line-height:1;max-width:820px">A mother and designer, <span style="font-style:italic">exploring her creative side.</span></h2>
      <p style="margin:0;font-size:16px;line-height:1.7;color:#5A5149;max-width:560px">Behind Cozy Texture Art is a mother and designer who found her way back to making things by hand. Between family life and design work, texture art became the slow, quiet corner of her day, and every piece carries a little of that calm into your home.</p>
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:16px 40px;font-size:12px;letter-spacing:.3em;text-transform:uppercase">
        <a href="#" style="border-bottom:1px solid currentColor;padding-bottom:4px">Instagram</a>
        <a href="#" style="border-bottom:1px solid currentColor;padding-bottom:4px">Email the studio</a>
      </div>
    </section>`;
  }

  render() {
    const st=this.state; const m=st.vw<720;
    let body;
    if (st.screen==='collection') body=this.collection(m);
    else if (st.screen==='detail') body=this.detail(m);
    else if (st.screen==='about') body=this.about(m);
    else body=this.home(m);
    return html`<div style="min-height:100vh;background:${PAPER};position:relative">
      ${h('div',{'aria-hidden':true,style:{position:'fixed',inset:0,pointerEvents:'none',zIndex:60,opacity:.32,mixBlendMode:'multiply',backgroundImage:GRAIN}})}
      ${this.nav(m)}
      <main>${body}</main>
      ${this.footer()}
    </div>`;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
